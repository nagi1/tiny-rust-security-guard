[package]
name = "tiny-rust-security-guard"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A small, conservative Linux filesystem guard for high-confidence execution and cron persistence indicators."
repository = "https://github.com/nagi1/tiny-rust-security-guard"
keywords = ["security", "linux", "rce", "cron", "rust"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3.2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
